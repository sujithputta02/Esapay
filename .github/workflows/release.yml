name: Release CLI & SDK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: esa
            archive_name: esa-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-14
            target: x86_64-apple-darwin
            binary_name: esa
            archive_name: esa-x86_64-apple-darwin.tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: esa
            archive_name: esa-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: esa.exe
            archive_name: esa-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build ESA CLI
        run: cargo build --release --bin esa --target ${{ matrix.target }}

      - name: Package CLI binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive_name }} ${{ matrix.binary_name }}
          cd ../../..

      - name: Package CLI binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.binary_name }} -DestinationPath ${{ matrix.archive_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-sdk:
    name: Publish TypeScript SDK (esapay) to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Build SDK
        working-directory: ./sdk/typescript
        run: |
          bun install
          bun run build

      - name: Publish to NPM
        working-directory: ./sdk/typescript
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm whoami
          CURRENT_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view esapay version 2>/dev/null || echo "")
          if [ "$CURRENT_VER" = "$REMOTE_VER" ]; then
            echo "Version $CURRENT_VER of esapay is already published to NPM. Skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    name: Publish CLI (esapay-cli) to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Publish CLI to NPM
        working-directory: ./packages/esa-cli
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          npm whoami
          CURRENT_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view esapay-cli version 2>/dev/null || echo "")
          if [ "$CURRENT_VER" = "$REMOTE_VER" ]; then
            echo "Version $CURRENT_VER of esapay-cli is already published to NPM. Skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python SDK (esapay) to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python package
        working-directory: ./sdk/python
        run: |
          rm -rf dist build *.egg-info
          python -m build

      - name: Publish to PyPI
        working-directory: ./sdk/python
        run: |
          twine upload --skip-existing --username __token__ --password ${{ secrets.PYPI_API_TOKEN }} dist/*

