<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas: Electric Royal Blue Gradient matching Landing Hero -->
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B5EFF"/>
      <stop offset="50%" stop-color="#1F51FF"/>
      <stop offset="100%" stop-color="#1237C4"/>
    </linearGradient>

    <!-- Radial High-Speed Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F51FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Glassmorphic Border -->
    <linearGradient id="innerStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Vibrant Emerald Safety Pulse -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow for Central Mark -->
    <filter id="markShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A1647" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base Container with Smooth Rounded Corners -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#heroGradient)"/>
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#ambientGlow)"/>

  <!-- Glassmorphic Rim -->
  <rect x="20" y="20" width="472" height="472" rx="120" stroke="url(#innerStroke)" stroke-width="8" fill="none"/>

  <!-- Main ESA Glyph: Stylized Sovereign Multi-Rail "E" + Forward Routing Chevron -->
  <g filter="url(#markShadow)">
    <!-- Vertical Spine (StateFabric Core Engine) -->
    <rect x="116" y="128" width="60" height="256" rx="24" fill="#FFFFFF"/>

    <!-- Top Rail (Razorpay Mumbai Rail) -->
    <rect x="116" y="128" width="216" height="56" rx="24" fill="#FFFFFF"/>

    <!-- Middle Rail (PhonePe Direct UPI Switch with Accelerated Routing) -->
    <rect x="116" y="228" width="160" height="56" rx="24" fill="#FFFFFF"/>

    <!-- Dynamic Lightning / Forward Failover Chevron -->
    <path d="M 296 220 L 352 256 L 296 292" 
          stroke="url(#emeraldGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>

    <!-- Bottom Rail (Paytm / Cashfree Settlement Corridor) -->
    <rect x="116" y="328" width="228" height="56" rx="24" fill="#FFFFFF"/>

    <!-- Active Sovereign Rail Status Pulse Indicator (Top Right) -->
    <circle cx="396" cy="116" r="24" fill="url(#emeraldGrad)"/>
    <circle cx="396" cy="116" r="34" stroke="#34D399" stroke-width="4" stroke-opacity="0.5" fill="none"/>
  </g>
</svg>
