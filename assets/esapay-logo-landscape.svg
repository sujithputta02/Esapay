<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180" fill="none">
  <defs>
    <!-- Background Card Linear Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1F51FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ambient Mesh Glows -->
    <radialGradient id="blueGlow" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1F51FF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#070A14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070A14" stop-opacity="0"/>
    </radialGradient>

    <!-- Icon Canvas: Royal Electric Blue Gradient -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B5EFF"/>
      <stop offset="50%" stop-color="#1F51FF"/>
      <stop offset="100%" stop-color="#1237C4"/>
    </linearGradient>

    <!-- Inner Glassmorphic Stroke -->
    <linearGradient id="innerStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Vibrant Emerald Safety Pulse -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Electric Accent Gradient for 'pay' -->
    <linearGradient id="payGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Filter for Drop Shadow -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#050C26" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Landscape Card Container -->
  <rect x="2" y="2" width="876" height="176" rx="24" fill="#070A14"/>
  <rect x="2" y="2" width="876" height="176" rx="24" fill="url(#blueGlow)"/>
  <rect x="2" y="2" width="876" height="176" rx="24" fill="url(#emeraldGlow)"/>
  <rect x="2" y="2" width="876" height="176" rx="24" stroke="url(#cardBorder)" stroke-width="1.5"/>

  <!-- ==================== LEFT LOGO EMBLEM ==================== -->
  <g transform="translate(32, 26)">
    <!-- Icon Container Squircle (128x128) -->
    <rect width="128" height="128" rx="34" fill="url(#iconGradient)"/>
    <rect x="1.5" y="1.5" width="125" height="125" rx="32.5" stroke="url(#innerStroke)" stroke-width="2" fill="none"/>

    <!-- Scaled ESA Glyph (Original 512x512 scaled by 0.25) -->
    <g transform="scale(0.25)" filter="url(#markShadow)">
      <!-- Vertical Spine (StateFabric Core Engine) -->
      <rect x="116" y="128" width="60" height="256" rx="24" fill="#FFFFFF"/>

      <!-- Top Rail (Razorpay Mumbai Rail) -->
      <rect x="116" y="128" width="216" height="56" rx="24" fill="#FFFFFF"/>

      <!-- Middle Rail (PhonePe Direct UPI Switch) -->
      <rect x="116" y="228" width="160" height="56" rx="24" fill="#FFFFFF"/>

      <!-- Dynamic Lightning / Forward Failover Chevron -->
      <path d="M 296 220 L 352 256 L 296 292" 
            stroke="url(#emeraldGrad)" 
            stroke-width="26" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none"/>

      <!-- Bottom Rail (Paytm / Cashfree Settlement Corridor) -->
      <rect x="116" y="328" width="228" height="56" rx="24" fill="#FFFFFF"/>

      <!-- Active Sovereign Rail Status Pulse Indicator -->
      <circle cx="396" cy="116" r="24" fill="url(#emeraldGrad)"/>
      <circle cx="396" cy="116" r="34" stroke="#34D399" stroke-width="4" stroke-opacity="0.5" fill="none"/>
    </g>
  </g>

  <!-- ==================== RIGHT BRAND TYPOGRAPHY ==================== -->
  <!-- Main Title: esapay -->
  <text x="182" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="-2.5" fill="#FFFFFF">
    esa<tspan fill="url(#payGradient)">pay</tspan>
  </text>

  <!-- Live Status Chip beside title -->
  <g transform="translate(434, 52)">
    <rect width="104" height="24" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#34D399"/>
    <text x="22" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10.5" font-weight="700" fill="#34D399" letter-spacing="0.6">v1.0.5 LIVE</text>
  </g>

  <!-- Primary Subtitle -->
  <text x="184" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14.5" font-weight="600" fill="#94A3B8" letter-spacing="-0.2">
    Autonomous Payment Infrastructure Resilience <tspan fill="#475569">·</tspan> Sovereign Indian &amp; Global Rails
  </text>

  <!-- Ecosystem Pill Tags (CLI · TypeScript · Python · REST/WS API) -->
  <g transform="translate(184, 144)">
    <text font-family="'JetBrains Mono', 'Fira Code', Menlo, monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.2">
      <tspan fill="#38BDF8">npm</tspan> esapay <tspan fill="#475569">|</tspan> <tspan fill="#34D399">pypi</tspan> esapay <tspan fill="#475569">|</tspan> <tspan fill="#F59E0B">cli</tspan> esapay-cli <tspan fill="#475569">|</tspan> <tspan fill="#A78BFA">rust</tspan> safety-gate
    </text>
  </g>
</svg>
